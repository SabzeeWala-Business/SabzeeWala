[build]
  base = "web_admin"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/otp"
  to = "/.netlify/functions/otp"
  status = 200

[[redirects]]
  from = "/msg91/*"
  to = "https://control.msg91.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
